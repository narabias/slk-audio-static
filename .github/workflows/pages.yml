name: Deploy static SLK converter

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch browser runtime files
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:vendor

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js README.md DEPLOY.md THIRD_PARTY_NOTICES.md .nojekyll _site/
          cp -R vendor _site/vendor

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
